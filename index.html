<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: 'DM Sans', sans-serif;
                letter-spacing: 0.8px;
                margin: 0;
            }

            #video-container {
                position: fixed;
                display: flex;
                width: 100%;
                height: 80%;
                top: 10%;
                justify-content: center;
            }
            #background-video {
                object-fit: cover;
                z-index: -1;
            }

            #cat {
                position: fixed;
                top: 95%;
                left: 95%;
                z-index: 1;
                transition: all 0.5s ease;
            }
            #cat:hover {
                left: 92%;
                top: 90%;
            }


            #menu {
                display: flex; 
                width: 96%; 
                justify-content: flex-end; 
                align-items: center; 
                gap: 1rem; 
                height: 10%;
            }
            .menu-item {
                cursor: pointer;
            }
            .menu-item.active {
                text-decoration: underline;
            }

            @media (max-width: 450px) {
                body {
                    font-size: 12px;
                }
            }
        </style>
    </head>
    <body>
        <div id="menu">
            <div class="menu-item">home</div>
            <div class="menu-item">about</div>
            <div class="menu-item">resume</div>
            <div class="menu-item">projects</div>
        </div>

        <div id="video-container">
            <video id="background-video" autoplay muted loop>
                <source src="./longwood_short.mp4" type="video/mp4">
            </video>
            <img src="./cat.webp" id="cat" title="https://www.pinterest.com/aleksiasouzasimoes/" width="160px"/>
        </div>

        <script>
            const menuItems = document.querySelectorAll('.menu-item');

            menuItems.forEach(item => {
                item.addEventListener('click', () => {
                    menuItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                });
            });

            // Optional: set the first menu item as active initially
            menuItems[0].classList.add('active');
        </script>
    </body>
</html>
