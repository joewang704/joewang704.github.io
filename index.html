        color: wheat;
      }

      #content {

        height: 60%;
        top: 20%;
        justify-content: center;
      }

      .menu-item.active {

      }

        }

        right: -60px;

        right: -10px;
      }

        body {
          font-size: 12px;
        }
      }

      .spark {
        position: fixed;
        width: 4px;
        height: 4px;
        background: wheat;
        border-radius: 50%;
        pointer-events: none;
        opacity: 1;
        transform: translate(0, 0);
        animation: sparkAnim 0.6s forwards;
      }

      @keyframes sparkAnim {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--x), var(--y)) scale(0);
        }
      }

      function jsxToElements(jsx) {
        const parser = new DOMParser()
        const doc = parser.parseFromString(jsx, 'text/html')
        const root = doc.body.firstElementChild

        function walk(node) {
          const el = document.createElement(node.tagName.toLowerCase())

          // set attributes
          for (const attr of node.attributes) {
            if (attr.name === 'class') {
              el.className = attr.value
            } else if (attr.name === 'id') {
              el.id = attr.value
            } else if (attr.value === '' && attr.name in el && typeof el[attr.name] === 'boolean') {
              el[attr.name] = true
            } else {
              el.setAttribute(attr.name, attr.value)
            }
          }

          // handle children
          for (const child of node.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
              const text = child.textContent.trim()
              if (text) el.textContent = text
            } else if (child.nodeType === Node.ELEMENT_NODE) {
              el.appendChild(walk(child))
            }
          }

          return el
        }

        return [walk(root)]
      }

          spark.style.top = e.clientY + 'px'
          spark.style.setProperty('--x', x)
          spark.style.setProperty('--y', y)

          document.body.appendChild(spark)

          setTimeout(() => spark.remove(), 600)
        }
